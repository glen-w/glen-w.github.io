[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --strict-config
    --color=yes
    --durations=10
markers =
    unit: marks tests as unit tests
    integration: marks tests as integration tests
    performance: marks tests as performance tests
    bibtex_syntax: marks tests as BibTeX syntax validation tests
    library: marks tests as library/content rendering tests
    rendering: marks tests as content rendering / front-matter tests
    golden: marks tests as golden / exemplar end-to-end fixtures
    corpus: marks tests as corpus-level invariant or zero-diff tests
    jekyll: marks tests as Jekyll build / site contract tests
    slow: marks tests as slow (deselect with '-m "not slow"')
    requires_bibtexparser: marks tests as requiring bibtexparser library
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
    ignore::FutureWarning
    ignore::pytest.PytestUnraisableExceptionWarning

