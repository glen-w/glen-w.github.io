<!DOCTYPE html>
<html lang="en">
<head><title>Video and landing</title></head>
<body>
  <div class="library-actions" role="group" aria-label="Document actions">
    <a
      href="/assets/pdf/talk.pdf"
      class="library-btn library-btn-primary"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span>PDF</span>
    </a>
    <a
      href="https://youtu.be/abc123"
      class="library-btn library-btn-secondary"
      target="_blank"
      rel="noopener noreferrer"
    >
      <i class="fa-solid fa-play" aria-hidden="true"></i>
      <span>Watch</span>
      <span class="visually-hidden"> (opens in a new tab)</span>
    </a>
    <a
      href="https://example.com/event"
      class="library-btn library-btn-secondary"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span>Event page <span aria-hidden="true">↗</span></span>
    </a>
  </div>
</body>
</html>
